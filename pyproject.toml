[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Suman Sarkar", email = "ssarkar445@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "openai>=3.7.0",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
ai-data-analyst = "ai_data_analyst:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
